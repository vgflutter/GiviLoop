name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  browser-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome
      - name: Install window management for native background browser tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openbox wmctrl
      - name: Select isolated test browser
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'GIVILOOP_CHROME_PATH=/opt/google/chrome/chrome\n')"
      - name: Test the installed package in a managed virtual desktop
        run: |
          xvfb-run -a bash -e <<'TEST_DESKTOP'
          openbox > /tmp/giviloop-window-manager.log 2>&1 &
          giviloop_wm_pid=$!
          trap 'kill "$giviloop_wm_pid" 2>/dev/null || true' EXIT
          giviloop_wm_ready=0
          for attempt in {1..50}; do
            if wmctrl -m >/dev/null 2>&1; then
              giviloop_wm_ready=1
              break
            fi
            sleep 0.1
          done
          if [ "$giviloop_wm_ready" != 1 ]; then
            cat /tmp/giviloop-window-manager.log
            exit 1
          fi
          npm run test:package -- --browser
          TEST_DESKTOP
      - name: Keep the checked package and verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: giviloop-checked-package
          path: |
            .giviloop/releases/*.tgz
            .giviloop/releases/release-checks.json
            .giviloop/releases/package-unit-tests.tap
            .giviloop/releases/package-browser-tests.tap
          include-hidden-files: true
          if-no-files-found: error
