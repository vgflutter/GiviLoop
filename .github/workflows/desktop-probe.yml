name: Desktop probe
on:
  workflow_dispatch:
  push:
    branches: [codex/windowless-cross-platform]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install current ordinary Chrome on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chrome
      - name: Prepare Linux
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chrome
          sudo apt-get install -y --no-install-recommends openbox wmctrl python3-xlib
      - name: Diagnose Linux
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a bash -e <<'PROBE'
          openbox >/tmp/givi-probe-wm.log 2>&1 &
          for attempt in {1..50}; do
            if wmctrl -m >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          node scripts/windowless-diagnostics.mjs
          node scripts/windowless-desktop.mjs
          PROBE
      - name: Diagnose Windows
        if: runner.os == 'Windows'
        run: |
          node scripts/windowless-diagnostics.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windowless-desktop.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: desktop-probe-${{ runner.os }}
          path: .giviloop/diagnostics/
          include-hidden-files: true
