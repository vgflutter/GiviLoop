name: Desktop probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare Linux
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chrome
          sudo apt-get install -y --no-install-recommends openbox wmctrl python3-xlib
      - name: Diagnose Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/windowless-diagnostics.mjs
      - name: Diagnose Windows
        if: runner.os == 'Windows'
        run: node scripts/windowless-diagnostics.mjs
