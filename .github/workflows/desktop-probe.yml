name: Windowless desktop
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Native system to validate'
        type: choice
        default: both
        options:
          - both
          - ubuntu-latest
          - windows-latest
      live-provider:
        description: 'Opt-in: send two public synthetic reviews to the selected real website'
        type: choice
        default: none
        options:
          - none
          - chatgpt-web
          - claude-web
          - gemini-web
          - deepseek-web
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.runner == 'both' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON(format('["{0}"]', inputs.runner)) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      GIVILOOP_LIVE_PROVIDER: ${{ inputs.live-provider }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install current ordinary Chrome on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chrome
      - name: Prepare Linux
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chrome
          sudo apt-get install -y --no-install-recommends openbox wmctrl python3-xlib
      - name: Diagnose Linux
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a bash -e <<'PROBE'
          openbox >/tmp/givi-probe-wm.log 2>&1 &
          giviloop_wm_pid=$!
          trap 'kill "$giviloop_wm_pid" 2>/dev/null || true' EXIT
          giviloop_wm_ready=0
          for attempt in {1..50}; do
            if wmctrl -m >/dev/null 2>&1; then giviloop_wm_ready=1; break; fi
            sleep 0.1
          done
          test "$giviloop_wm_ready" = 1
          if [ "$GIVILOOP_LIVE_PROVIDER" != none ]; then
            node scripts/windowless-desktop.mjs --live-provider "$GIVILOOP_LIVE_PROVIDER"
          else
            node scripts/windowless-desktop.mjs
          fi
          PROBE
      - name: Diagnose Windows
        if: runner.os == 'Windows'
        run: |
          if ($env:GIVILOOP_LIVE_PROVIDER -ne 'none') {
            node scripts/windowless-desktop.mjs --live-provider $env:GIVILOOP_LIVE_PROVIDER
          } else {
            node scripts/windowless-desktop.mjs
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: desktop-probe-${{ runner.os }}
          path: .giviloop/diagnostics/
          include-hidden-files: true
